<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-label="ERD 03 — Autentikasi, audit, dan retry">
<title>ERD 03 — Autentikasi, audit, dan retry</title><desc>Relasi token polimorfik dan referensi audit dibedakan dari foreign key fisik PostgreSQL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#89819a" stroke-width="1.4"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}</style><rect width="1600" height="1120" fill="#faf9fd"/>
<text x="50" y="42" font-size="15" fill="#7351c5" font-weight="700" text-anchor="start">PIPELINE FUNDING MANAGEMENT  /  DESAIN SISTEM  /  19 OKTOBER 2026</text>
<text x="50" y="88" font-size="34" fill="#241e3b" font-weight="700" text-anchor="start">ERD 03 — Autentikasi, audit, dan retry</text><text x="50" y="118" font-size="18" fill="#665e77" font-weight="400" text-anchor="start">Relasi token polimorfik dan referensi audit dibedakan dari foreign key fisik PostgreSQL.</text><path d="M400 250H610" fill="none" stroke="#237e74" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="413" y="216" width="150.8" height="27" rx="5" fill="#f7f5fb"/><text x="420" y="235" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N · polimorfik</text><path d="M400 335H500V475H1350V440" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="673" y="444" width="217.20000000000002" height="27" rx="5" fill="#f7f5fb"/><text x="680" y="463" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N permintaan tersimpan</text><path d="M400 370H485V710H610" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="493" y="541" width="184.0" height="27" rx="5" fill="#f7f5fb"/><text x="500" y="560" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">actor 0..1 / N audit</text><path d="M1010 730H1160" fill="none" stroke="#237e74" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="1018" y="696" width="142.5" height="27" rx="5" fill="#f7f5fb"/><text x="1025" y="715" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">referensi logis</text><rect x="50" y="160" width="350" height="250" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 160H384Q400 160 400 176V212H50V176Q50 160 66 160" fill="#7351c5"/><text x="70" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">users</text><text x="70" y="244" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK division_id?</text><text x="70" y="273" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">UK username · email?</text><text x="70" y="302" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">password: hash, bukan plaintext</text><text x="70" y="331" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">role: pic / head</text><text x="70" y="360" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">is_active · timestamps</text><rect x="610" y="160" width="400" height="250" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M626 160H994Q1010 160 1010 176V212H610V176Q610 160 626 160" fill="#426ba6"/><text x="630" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">personal_access_tokens</text><text x="630" y="244" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · UK token (hash)</text><text x="630" y="273" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">tokenable_type · tokenable_id</text><text x="630" y="302" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">name · abilities?</text><text x="630" y="331" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">last_used_at? · expires_at?</text><text x="630" y="360" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">timestamps</text><rect x="1160" y="160" width="390" height="280" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1176 160H1534Q1550 160 1550 176V212H1160V176Q1160 160 1176 160" fill="#237e74"/><text x="1180" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">request_receipts</text><text x="1180" y="244" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK user_id → users</text><text x="1180" y="273" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">request_key : uuid</text><text x="1180" y="302" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">request_hash : varchar(64)</text><text x="1180" y="331" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">status_code · response_body</text><text x="1180" y="360" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">created_at</text><text x="1180" y="389" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">UK(user_id, request_key)</text><rect x="610" y="600" width="400" height="270" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M626 600H994Q1010 600 1010 616V652H610V616Q610 600 626 600" fill="#7351c5"/><text x="630" y="634" font-size="20" fill="#fff" font-weight="700" text-anchor="start">audit_events</text><text x="630" y="684" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK actor_id? → users</text><text x="630" y="713" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">resource_type · resource_id</text><text x="630" y="742" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">action</text><text x="630" y="771" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">before_data? · after_data? : json</text><text x="630" y="800" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">occurred_at · source</text><rect x="50" y="600" width="400" height="260" rx="14" fill="#efebf8"/><text x="70" y="632" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">8 tabel infrastruktur Laravel</text><text x="70" y="665" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">password_reset_tokens · sessions</text><text x="70" y="693" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">cache · cache_locks</text><text x="70" y="721" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">jobs · job_batches · failed_jobs</text><text x="70" y="749" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">migrations</text><text x="70" y="777" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">sessions.user_id: indeks, bukan FK.</text><text x="70" y="805" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Tabel tersedia tidak berarti semua</text><text x="70" y="833" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">fiturnya diaktifkan pada halaman.</text><rect x="1160" y="600" width="390" height="232" rx="14" fill="#efebf8"/><text x="1180" y="632" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">Referensi resource audit</text><text x="1180" y="665" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">opportunity</text><text x="1180" y="693" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">annual_target</text><text x="1180" y="721" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">unit_realization</text><text x="1180" y="749" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">branch_target</text><text x="1180" y="777" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">resource_id disimpan sebagai teks.</text><text x="1180" y="805" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Tidak ada FK SQL ke empat tabel.</text><rect x="610" y="930" width="940" height="120" rx="14" fill="#efebf8"/><text x="630" y="962" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">Simpan dan retry berada dalam transaksi yang sama</text><text x="630" y="995" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Key + payload sama: hasil sukses sebelumnya dikembalikan tanpa duplikasi.</text><text x="630" y="1023" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Payload berbeda pada key yang sama atau versi lama: konflik HTTP 409.</text>
<path d="M50 1058H1550" stroke="#ded8ea"/><text x="50" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="start">PK = primary key  ·  FK = foreign key  ·  UK = unique  ·  ? = nullable  ·  1:N = satu ke banyak  ·  putus-putus = relasi logis</text>
<text x="1550" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="end">PostgreSQL · Laravel · Vue.js</text></svg>