<text x="100" y="2250.0" font-size="22" fill="#4f626e" font-weight="400" text-anchor="start">Tanda garis miring pada simbol = pengulangan entitas / penyimpanan dengan ID yang sama. Rincian paket data: DFD.md.</text><text x="100" y="2300.0" font-size="22" fill="#4f626e" font-weight="400" text-anchor="start">Hierarki: konteks 0 → Level 1 (1.0–5.0) → Level 2 proses 3.0 → Level 3 proses 3.5.</text><text x="100" y="2349.0" font-size="18" fill="#4f626e" font-weight="600" text-anchor="start">PIPELINE FUNDING MANAGEMENT SYSTEM</text><text x="3260" y="2349.0" font-size="20" fill="#4f626e" font-weight="600" text-anchor="end">01 / 04</text></svg>