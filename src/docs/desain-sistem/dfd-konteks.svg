idth="1.5"/><text x="100" y="1450.0" font-size="24" fill="#172b3a" font-weight="700" text-anchor="start">E1  /  PIC FUNDING</text><text x="100" y="1510" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Mengelola peluang dan target divisinya.</text><text x="100" y="1558" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Membaca ringkasan dan riwayat divisi.</text><text x="100" y="1606" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">CMS dikelola pada lingkup bersama.</text><text x="1190" y="1450.0" font-size="24" fill="#172b3a" font-weight="700" text-anchor="start">E2  /  HEAD FUNDING</text><text x="1190" y="1510" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Mengakses Konsumer dan Komersil.</text><text x="1190" y="1558" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Mengelola data sesuai divisi / lingkup.</text><text x="1190" y="1606" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Memantau laporan divisi atau gabungan.</text><text x="2280" y="1450.0" font-size="24" fill="#172b3a" font-weight="700" text-anchor="start">BATAS SISTEM</text><text x="2280" y="1510" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Nasabah dicatat sebagai data peluang.</text><text x="2280" y="1558" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Interaksi aplikasi melalui PIC dan Head.</text><text x="2280" y="1606" font-size="27" fill="#4f626e" font-weight="400" text-anchor="start">Tidak ada integrasi sistem inti bank.</text><text x="100" y="1805.0" font-size="26" fill="#4f626e" font-weight="400" text-anchor="start">Paket masukan dan keluaran diuraikan pada Level 1; penyimpanan internal mulai ditampilkan pada Level 1.</text><path d="M100 2080H3260" stroke="#cbd5dc" stroke-width="1.5"/>
