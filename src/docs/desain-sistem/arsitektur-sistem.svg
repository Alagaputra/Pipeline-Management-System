<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-label="Arsitektur aplikasi yang diterapkan">
<title>Arsitektur aplikasi yang diterapkan</title><desc>Pola client–server berlapis: antarmuka Vue.js, Laravel REST API, dan penyimpanan relasional PostgreSQL.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#89819a" stroke-width="1.4"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}</style><rect width="1600" height="1120" fill="#faf9fd"/>
<text x="50" y="42" font-size="15" fill="#7351c5" font-weight="700" text-anchor="start">PIPELINE FUNDING MANAGEMENT  /  DESAIN SISTEM  /  19 OKTOBER 2026</text>
<text x="50" y="88" font-size="34" fill="#241e3b" font-weight="700" text-anchor="start">Arsitektur aplikasi yang diterapkan</text><text x="50" y="118" font-size="18" fill="#665e77" font-weight="400" text-anchor="start">Pola client–server berlapis: antarmuka Vue.js, Laravel REST API, dan penyimpanan relasional PostgreSQL.</text><text x="50" y="165" font-size="17" fill="#7351c5" font-weight="700" text-anchor="start">01  PENGGUNA</text><rect x="50" y="200" width="290" height="210" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 200H324Q340 200 340 216V252H50V216Q50 200 66 200" fill="#7351c5"/><text x="70" y="234" font-size="20" fill="#fff" font-weight="700" text-anchor="start">PIC / Head Funding</text><text x="70" y="284" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">Konsumer · Komersil</text><text x="70" y="313" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">Browser desktop / ponsel</text><text x="70" y="342" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">Akses mengikuti divisi dan role</text><path d="M340 300H410" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="351" y="266" width="34.6" height="27" rx="5" fill="#f7f5fb"/><text x="358" y="285" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">UI</text><text x="410" y="165" font-size="17" fill="#7351c5" font-weight="700" text-anchor="start">02  FRONTEND · VUE.JS</text><rect x="410" y="200" width="480" height="210" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M426 200H874Q890 200 890 216V252H410V216Q410 200 426 200" fill="#7351c5"/><text x="430" y="234" font-size="20" fill="#fff" font-weight="700" text-anchor="start">Vue Router + halaman</text><text x="430" y="284" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Dashboard · Pipeline · Target</text><text x="430" y="313" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Riwayat · Tim · Login</text><text x="430" y="342" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Chart.js: grafik laporan</text><text x="430" y="371" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Komponen kartu, formulir, dan dialog</text><rect x="410" y="465" width="480" height="210" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M426 465H874Q890 465 890 481V517H410V481Q410 465 426 465" fill="#426ba6"/><text x="430" y="499" font-size="20" fill="#fff" font-weight="700" text-anchor="start">State dan layanan API</text><text x="430" y="549" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">useSession · usePipeline</text><text x="430" y="578" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">services/api.js: fetch + bearer token</text><text x="430" y="607" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Idempotency-Key untuk penyimpanan</text><text x="430" y="636" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Guard isian, sesi, tahun, dan divisi</text><path d="M650 410V465" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="658" y="429" width="117.60000000000001" height="27" rx="5" fill="#f7f5fb"/><text x="665" y="448" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">state / aksi</text><path d="M890 565H950V300H1020" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="896" y="428" width="109.30000000000001" height="27" rx="5" fill="#f7f5fb"/><text x="903" y="447" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">HTTP / JSON</text><text x="1020" y="165" font-size="17" fill="#7351c5" font-weight="700" text-anchor="start">03  BACKEND · LARAVEL REST API</text><rect x="1020" y="200" width="530" height="210" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1036 200H1534Q1550 200 1550 216V252H1020V216Q1020 200 1036 200" fill="#7351c5"/><text x="1040" y="234" font-size="20" fill="#fff" font-weight="700" text-anchor="start">Middleware dan autentikasi</text><text x="1040" y="284" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Login: pembatasan percobaan</text><text x="1040" y="313" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Sanctum: validasi bearer token</text><text x="1040" y="342" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">IdempotentWrite: transaksi dan replay</text><text x="1040" y="371" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Controller: izin divisi dan validasi input</text><rect x="1020" y="465" width="530" height="240" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1036 465H1534Q1550 465 1550 481V517H1020V481Q1020 465 1036 465" fill="#7351c5"/><text x="1040" y="499" font-size="20" fill="#fff" font-weight="700" text-anchor="start">Controller + logika bisnis</text><text x="1040" y="549" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">AuthController · LookupController</text><text x="1040" y="578" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">OpportunityController · TargetController</text><text x="1040" y="607" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">ReportController → DashboardReport</text><text x="1040" y="636" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">WritesAudit: catatan perubahan</text><text x="1040" y="665" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Eloquent Models: baca / tulis data</text><path d="M1285 410V465" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1293" y="428" width="200.60000000000002" height="27" rx="5" fill="#f7f5fb"/><text x="1300" y="447" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">request terautentikasi</text><path d="M1285 705V800" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1293" y="741" width="159.10000000000002" height="27" rx="5" fill="#f7f5fb"/><text x="1300" y="760" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">query / transaksi</text><rect x="1020" y="800" width="530" height="190" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1036 800H1534Q1550 800 1550 816V852H1020V816Q1020 800 1036 800" fill="#237e74"/><text x="1040" y="834" font-size="20" fill="#fff" font-weight="700" text-anchor="start">PostgreSQL</text><text x="1040" y="884" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">13 tabel domain + Sanctum + infrastruktur</text><text x="1040" y="913" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">FK · UNIQUE · row lock · version</text><text x="1040" y="942" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Data peluang, target, audit, request_receipts</text><rect x="50" y="760" width="840" height="204" rx="14" fill="#efebf8"/><text x="70" y="792" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">Alur data dan batas sistem</text><text x="70" y="825" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Browser mengirim aksi; Laravel memvalidasi, menyimpan, lalu mengembalikan JSON.</text><text x="70" y="853" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">DashboardReport menghitung laporan di backend; Chart.js menggambar di browser.</text><text x="70" y="881" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Token ada di browser. Data operasional tetap berada di PostgreSQL.</text><text x="70" y="909" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Lokal: frontend 5173 → proxy /api → Laravel 8000 → PostgreSQL 5432.</text><text x="70" y="937" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Aplikasi ini mencatat pipeline; tidak menjalankan transaksi sistem inti bank.</text>
<path d="M50 1058H1550" stroke="#ded8ea"/><text x="50" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="start">PK = primary key  ·  FK = foreign key  ·  UK = unique  ·  ? = nullable  ·  1:N = satu ke banyak  ·  putus-putus = relasi logis</text>
<text x="1550" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="end">PostgreSQL · Laravel · Vue.js</text></svg>