<text x="50" y="88" font-size="34" fill="#241e3b" font-weight="700" text-anchor="start">ERD 01 — Master dan pipeline</text><text x="50" y="118" font-size="18" fill="#665e77" font-weight="400" text-anchor="start">Atribut utama; kardinalitas dan FK lengkap tersedia pada DESAIN-DATABASE.md dan erd-lengkap.mmd.</text><path d="M390 225H630" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="413" y="191" width="184.0" height="27" rx="5" fill="#f7f5fb"/><text x="420" y="210" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">0..1 divisi / N akun</text><path d="M220 342V480" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="229" y="401" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="236" y="420" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><path d="M1380 365V425H220V480" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="893" y="398" width="233.8" height="27" rx="5" fill="#f7f5fb"/><text x="900" y="417" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">produk 1:N pasangan divisi</text><path d="M390 290H470V460H710V490" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="473" y="431" width="167.4" height="27" rx="5" fill="#f7f5fb"/><text x="480" y="450" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">divisi 1:N peluang</text><path d="M800 385V490" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="808" y="432" width="76.10000000000001" height="27" rx="5" fill="#f7f5fb"/><text x="815" y="451" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">PIC 1:N</text><path d="M1210 300H1110V680H1000" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1023" y="684" width="101.0" height="27" rx="5" fill="#f7f5fb"/><text x="1030" y="703" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">produk 1:N</text><path d="M1000 590H1200" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1065" y="556" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="1072" y="575" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><path d="M970 250H1125V465H1370V500" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1238" y="436" width="76.10000000000001" height="27" rx="5" fill="#f7f5fb"/><text x="1245" y="455" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">PIC 1:N</text><path d="M630 335H440V755H240V790" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="443" y="725" width="92.7" height="27" rx="5" fill="#f7f5fb"/><text x="450" y="744" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">actor 1:N</text><path d="M430 910H520V800H600" fill="none" stroke="#237e74" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="448" y="881" width="167.4" height="27" rx="5" fill="#f7f5fb"/><text x="455" y="900" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">resource_type / id</text><rect x="50" y="160" width="340" height="182" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 160H374Q390 160 390 176V212H50V176Q50 160 66 160" fill="#7351c5"/><text x="70" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">divisions</text><text x="70" y="244" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · bigint</text><text x="70" y="273" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">UK code · varchar(30)</text><text x="70" y="302" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">name · varchar(80)</text><rect x="630" y="160" width="340" height="225" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M646 160H954Q970 160 970 176V212H630V176Q630 160 646 160" fill="#7351c5"/><text x="650" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">users</text><text x="650" y="244" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · bigint</text><text x="650" y="273" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">FK division_id? → divisions</text><text x="650" y="302" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">UK username · varchar(50)</text><text x="650" y="331" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">name · password (hash)</text><text x="650" y="360" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">role · is_active</text><rect x="1210" y="160" width="340" height="205" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1226 160H1534Q1550 160 1550 176V212H1210V176Q1210 160 1226 160" fill="#7351c5"/><text x="1230" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">products</text><text x="1230" y="244" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · bigint</text><text x="1230" y="273" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">UK code · varchar(40)</text><text x="1230" y="302" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">name · varchar(80)</text><text x="1230" y="331" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">measure: IDR / UNIT</text><rect x="50" y="480" width="340" height="145" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 480H374Q390 480 390 496V532H50V496Q50 480 66 480" fill="#7351c5"/><text x="70" y="514" font-size="20" fill="#fff" font-weight="700" text-anchor="start">division_products</text><text x="70" y="564" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK, FK division_id</text><text x="70" y="593" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK, FK product_id</text><rect x="600" y="490" width="400" height="370" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M616 490H984Q1000 490 1000 506V542H600V506Q600 490 616 490" fill="#7351c5"/><text x="620" y="524" font-size="20" fill="#fff" font-weight="700" text-anchor="start">opportunities</text><text x="620" y="574" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · UK legacy_id?</text><text x="620" y="603" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK division_id · pic_id · product_id</text><text x="620" y="632" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">customer_name · segment</text><text x="620" y="661" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">nominal · realization : bigint</text><text x="620" y="690" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">interest_status · outcome</text><text x="620" y="719" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">recorded_date · follow_up_date?</text><text x="620" y="748" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">follow_up_completed · closed_date?</text><text x="620" y="777" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">notes? · lost_reason?</text><text x="620" y="806" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK created_by? · updated_by?</text><text x="620" y="835" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">version · timestamps</text><rect x="1200" y="500" width="350" height="254" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1216 500H1534Q1550 500 1550 516V552H1200V516Q1200 500 1216 500" fill="#7351c5"/><text x="1220" y="534" font-size="20" fill="#fff" font-weight="700" text-anchor="start">opportunity_assignments</text><text x="1220" y="584" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK opportunity_id</text><text x="1220" y="613" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK pic_id → users</text><text x="1220" y="642" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">assigned_at? · unassigned_at?</text><text x="1220" y="671" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK changed_by? → users</text><text x="1220" y="700" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">source · timestamps</text><rect x="50" y="790" width="380" height="225" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 790H414Q430 790 430 806V842H50V806Q50 790 66 790" fill="#237e74"/><text x="70" y="824" font-size="20" fill="#fff" font-weight="700" text-anchor="start">audit_events</text><text x="70" y="874" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK actor_id? → users</text><text x="70" y="903" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">resource_type · resource_id</text><text x="70" y="932" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">action · before_data? · after_data?</text><text x="70" y="961" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">occurred_at · source</text><rect x="600" y="910" width="950" height="148" rx="14" fill="#efebf8"/><text x="620" y="942" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">Status ketertarikan berbeda dengan hasil closing</text><text x="620" y="975" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Cold / Warm / Hot = ketertarikan. Active / Won / Lost = hasil peluang.</text><text x="620" y="1003" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Riwayat membaca opportunities yang sama; tidak membuat tabel salinan.</text><text x="620" y="1031" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Kolom pembuat/editor/changed_by merujuk users; FK lengkap ada di kamus data.</text>
<path d="M50 1058H1550" stroke="#ded8ea"/><text x="50" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="start">PK = primary key  ·  FK = foreign key  ·  UK = unique  ·  ? = nullable  ·  1:N = satu ke banyak  ·  putus-putus = relasi logis</text>
