<text x="50" y="88" font-size="34" fill="#241e3b" font-weight="700" text-anchor="start">ERD 02 — Target dan realisasi</text><text x="50" y="118" font-size="18" fill="#665e77" font-weight="400" text-anchor="start">Target tahunan, rincian bulanan, realisasi layanan, dan data target cabang kompatibilitas.</text><path d="M380 240H570" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="395" y="206" width="192.3" height="27" rx="5" fill="#f7f5fb"/><text x="402" y="225" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">0..1 divisi / N scope</text><path d="M770 375V500" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="783" y="430" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="790" y="449" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><path d="M380 560H570" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="400" y="527" width="101.0" height="27" rx="5" fill="#f7f5fb"/><text x="407" y="546" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">produk 1:N</text><path d="M970 565H1080V255H1190" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1089" y="221" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="1096" y="240" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><path d="M970 665H1190" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1046" y="631" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="1053" y="650" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><path d="M50 290H25V920H50" fill="none" stroke="#89819a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="23" y="779" width="42.900000000000006" height="27" rx="5" fill="#f7f5fb"/><text x="30" y="798" font-size="15" fill="#665e77" font-weight="600" text-anchor="start">1:N</text><rect x="50" y="160" width="330" height="211" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 160H364Q380 160 380 176V212H50V176Q50 160 66 160" fill="#7351c5"/><text x="70" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">divisions</text><text x="70" y="244" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · bigint</text><text x="70" y="273" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">UK code</text><text x="70" y="302" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Konsumer / Komersil</text><rect x="50" y="450" width="330" height="211" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 450H364Q380 450 380 466V502H50V466Q50 450 66 450" fill="#7351c5"/><text x="70" y="484" font-size="20" fill="#fff" font-weight="700" text-anchor="start">products</text><text x="70" y="534" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · UK code</text><text x="70" y="563" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">measure: IDR / UNIT</text><text x="70" y="592" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">Dana dan unit dipisahkan</text><rect x="570" y="160" width="400" height="215" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M586 160H954Q970 160 970 176V212H570V176Q570 160 586 160" fill="#7351c5"/><text x="590" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">target_scopes</text><text x="590" y="244" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK code · varchar(30)</text><text x="590" y="273" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">FK division_id? → divisions</text><text x="590" y="302" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">label · timestamps</text><text x="590" y="331" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">komersil / konsumer / shared</text><rect x="570" y="500" width="400" height="285" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M586 500H954Q970 500 970 516V552H570V516Q570 500 586 500" fill="#7351c5"/><text x="590" y="534" font-size="20" fill="#fff" font-weight="700" text-anchor="start">annual_targets</text><text x="590" y="584" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK scope_code</text><text x="590" y="613" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">FK product_id → products</text><text x="590" y="642" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">year · target_value : bigint</text><text x="590" y="671" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">FK updated_by? → users</text><text x="590" y="700" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">version · timestamps</text><text x="590" y="729" font-size="18" fill="#241e3b" font-weight="400" text-anchor="start">UK(scope_code, product_id, year)</text><rect x="1190" y="160" width="360" height="215" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1206 160H1534Q1550 160 1550 176V212H1190V176Q1190 160 1206 160" fill="#7351c5"/><text x="1210" y="194" font-size="20" fill="#fff" font-weight="700" text-anchor="start">monthly_targets</text><text x="1210" y="244" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK annual_target_id</text><text x="1210" y="273" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">month · target_value : bigint</text><text x="1210" y="302" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">timestamps</text><text x="1210" y="331" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">UK(annual_target_id, month)</text><rect x="1190" y="500" width="360" height="270" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M1206 500H1534Q1550 500 1550 516V552H1190V516Q1190 500 1206 500" fill="#237e74"/><text x="1210" y="534" font-size="20" fill="#fff" font-weight="700" text-anchor="start">unit_realizations</text><text x="1210" y="584" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK annual_target_id</text><text x="1210" y="613" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">month · units : bigint</text><text x="1210" y="642" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK updated_by? → users</text><text x="1210" y="671" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">version · timestamps</text><text x="1210" y="700" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">UK(annual_target_id, month)</text><rect x="50" y="820" width="420" height="215" rx="16" fill="#fff" stroke="#ded8ea" stroke-width="1.5"/><path d="M66 820H454Q470 820 470 836V872H50V836Q50 820 66 820" fill="#426ba6"/><text x="70" y="854" font-size="20" fill="#fff" font-weight="700" text-anchor="start">branch_targets</text><text x="70" y="904" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">PK id · FK division_id</text><text x="70" y="933" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">branch_code · year · target_value</text><text x="70" y="962" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">FK updated_by? · version</text><text x="70" y="991" font-size="17" fill="#241e3b" font-weight="400" text-anchor="start">UK(division_id, branch_code, year)</text><rect x="570" y="840" width="980" height="176" rx="14" fill="#efebf8"/><text x="590" y="872" font-size="19" fill="#7351c5" font-weight="700" text-anchor="start">Lingkup target dan sumber realisasi</text><text x="590" y="905" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">CMS: scope shared, satu target untuk kedua divisi. Bale Syariah / QRIS: Konsumer.</text><text x="590" y="933" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Realisasi dana: opportunities berstatus Won, menurut tahun closed_date.</text><text x="590" y="961" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Realisasi layanan: jumlah units bulanan. Target cabang lama tetap disimpan.</text><text x="590" y="989" font-size="17" fill="#665e77" font-weight="400" text-anchor="start">Bulan 1–12 dan tahun 2000–2100 diperiksa API; bukan CHECK SQL.</text>
<path d="M50 1058H1550" stroke="#ded8ea"/><text x="50" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="start">PK = primary key  ·  FK = foreign key  ·  UK = unique  ·  ? = nullable  ·  1:N = satu ke banyak  ·  putus-putus = relasi logis</text>
<text x="1550" y="1088" font-size="16" fill="#665e77" font-weight="400" text-anchor="end">PostgreSQL · Laravel · Vue.js</text></svg>