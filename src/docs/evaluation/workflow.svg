<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-label="Alur kerja opportunity. Closing tidak menghapus record." style="font-family:Arial,sans-serif"><title>Alur kerja opportunity. Closing tidak menghapus record.</title><rect width="100%" height="100%" fill="#faf9fd"/><path d="M310 140 H450 M770 140 H900 M1050 154 V280 H610 V365 M450 440 H310 M770 440 H900 M160 469 V630 H610 M1050 469 V630 H610" fill="none" stroke="#827799" stroke-width="2"/><g><rect x="40" y="75" width="270" height="79" rx="12" fill="white" stroke="#d8d4e5"/><path d="M52,75H298Q310,75 310,87V117H40V87Q40,75 52,75" fill="#6544cf"/><text x="56" y="102" fill="white" font-size="16" font-weight="700">1. Login</text><text x="56" y="140" font-size="13" fill="#303048">Akun pribadi dan divisi</text></g><g><rect x="450" y="75" width="320" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M462,75H758Q770,75 770,87V117H450V87Q450,75 462,75" fill="#6544cf"/><text x="466" y="102" fill="white" font-size="16" font-weight="700">2. Pipeline</text><text x="466" y="140" font-size="13" fill="#303048">Catat/edit dalam drawer</text><text x="466" y="165" font-size="13" fill="#303048">Validasi PIC, produk, nominal</text></g><g><rect x="900" y="75" width="300" height="79" rx="12" fill="white" stroke="#d8d4e5"/><path d="M912,75H1188Q1200,75 1200,87V117H900V87Q900,75 912,75" fill="#6544cf"/><text x="916" y="102" fill="white" font-size="16" font-weight="700">3. Active</text><text x="916" y="140" font-size="13" fill="#303048">Follow-up atau closing</text></g><text x="650" y="310" font-size="14" fill="#625775">Follow-up selesai tetap Active.</text><g><rect x="450" y="365" width="320" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M462,365H758Q770,365 770,377V407H450V377Q450,365 462,365" fill="#6544cf"/><text x="466" y="392" fill="white" font-size="16" font-weight="700">4. Pilih hasil</text><text x="466" y="430" font-size="13" fill="#303048">Validasi tanggal dan data closing</text><text x="466" y="455" font-size="13" fill="#303048">Data salah: kembali ke form</text></g><g><rect x="40" y="365" width="270" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M52,365H298Q310,365 310,377V407H40V377Q40,365 52,365" fill="#237c76"/><text x="56" y="392" fill="white" font-size="16" font-weight="700">Won</text><text x="56" y="430" font-size="13" fill="#303048">Realisasi positif</text><text x="56" y="455" font-size="13" fill="#303048">Tidak melebihi nominal</text></g><g><rect x="900" y="365" width="300" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M912,365H1188Q1200,365 1200,377V407H900V377Q900,365 912,365" fill="#a75b51"/><text x="916" y="392" fill="white" font-size="16" font-weight="700">Lost</text><text x="916" y="430" font-size="13" fill="#303048">Alasan wajib</text><text x="916" y="455" font-size="13" fill="#303048">Realisasi dana nol</text></g><g><rect x="450" y="630" width="320" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M462,630H758Q770,630 770,642V672H450V642Q450,630 462,630" fill="#6544cf"/><text x="466" y="657" fill="white" font-size="16" font-weight="700">5. History + laporan</text><text x="466" y="695" font-size="13" fill="#303048">Record tetap tersimpan</text><text x="466" y="720" font-size="13" fill="#303048">Rekap menurut tanggal closing</text></g></svg>