<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" role="img" aria-label="Arsitektur Vue, Laravel REST API, dan MySQL yang sudah diterapkan." style="font-family:Arial,sans-serif"><title>Arsitektur Vue, Laravel REST API, dan MySQL yang sudah diterapkan.</title><rect width="100%" height="100%" fill="#faf9fd"/><text x="40" y="38" font-size="20" font-weight="700" fill="#242339">ARSITEKTUR SAAT INI · SUDAH DITERAPKAN</text><path d="M330 142 H460 M790 142 H920" fill="none" stroke="#827799" stroke-width="2"/><g><rect x="340" y="112" width="90" height="21" rx="4" fill="#f4f1fb"/><text x="345" y="127" font-size="12" fill="#514367">HTTPS/JSON</text></g><g><rect x="810" y="112" width="50" height="21" rx="4" fill="#f4f1fb"/><text x="815" y="127" font-size="12" fill="#514367">query</text></g><g><rect x="40" y="75" width="290" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M52,75H318Q330,75 330,87V117H40V87Q40,75 52,75" fill="#6544cf"/><text x="56" y="102" fill="white" font-size="16" font-weight="700">Vue + CSS</text><text x="56" y="140" font-size="13" fill="#303048">UI dan form PIC</text><text x="56" y="165" font-size="13" fill="#303048">Token sesi di browser</text></g><g><rect x="460" y="75" width="330" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M472,75H778Q790,75 790,87V117H460V87Q460,75 472,75" fill="#6544cf"/><text x="476" y="102" fill="white" font-size="16" font-weight="700">Laravel REST API</text><text x="476" y="140" font-size="13" fill="#303048">Sanctum dan aturan akses</text><text x="476" y="165" font-size="13" fill="#303048">Validasi, transaksi, audit</text></g><g><rect x="920" y="75" width="280" height="104" rx="12" fill="white" stroke="#d8d4e5"/><path d="M932,75H1188Q1200,75 1200,87V117H920V87Q920,75 932,75" fill="#6544cf"/><text x="936" y="102" fill="white" font-size="16" font-weight="700">MySQL Laragon</text><text x="936" y="140" font-size="13" fill="#303048">Database pipeline_funding</text><text x="936" y="165" font-size="13" fill="#303048">Relasi dan integritas data</text></g><text x="40" y="315" font-size="15" fill="#625775">Laravel mengembalikan data atau error ke Vue. Docker dan Chart.js tidak diperlukan untuk menjalankan sistem ini.</text></svg>